<meta name="description" content="Analisi dei prezzi Amazon di iPhone 14, 15, 16 e 17: sconti, stagionalità e il momento migliore per comprare.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout come risultati.html: copertina a tutta larghezza, barra fissa con titolo e capitolo, indice a sinistra
   sopra i 1180px (a tendina sotto), scorrimento che si ferma a ogni capitolo. Verde acqua = analisi, rosso mattone = oggi. */
:root{
  --barra:60px;
  --bg:#f9fafb; --surface:#ffffff; --ink:#111111; --ink-2:#44484f; --ink-3:#73777e; --line:#e1e4ea;
  --c1:#2a8c99; --c1-ink:#1d6672; --c2:#d6452a; --c2-ink:#a8301a; --argento:#dccfae;
  --accent:var(--c1-ink); --accent-soft:#dff0f1; --c2-soft:#fbe3dc;
  --grigio:#6b6e72; --grigio-linea:#a2a39e; --copertina:#efe3c8;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101214; --surface:#181b1f; --ink:#f1f2f4; --ink-2:#b9bcc2; --ink-3:#8a8e95; --line:#2b2f35;
  --c1:#4db6c3; --c1-ink:#7fcdd8; --c2:#f2704f; --c2-ink:#f79a80; --argento:#6b6555;
  --accent-soft:#12292d; --c2-soft:#3a1d15; --grigio:#a3a39d; --grigio-linea:#6f716d; --copertina:#1b1e22;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#101214; --surface:#181b1f; --ink:#f1f2f4; --ink-2:#b9bcc2; --ink-3:#8a8e95; --line:#2b2f35;
  --c1:#4db6c3; --c1-ink:#7fcdd8; --c2:#f2704f; --c2-ink:#f79a80; --argento:#6b6555;
  --accent-soft:#12292d; --c2-soft:#3a1d15; --grigio:#a3a39d; --grigio-linea:#6f716d; --copertina:#1b1e22;
  color-scheme:dark; }

*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:calc(var(--barra) + 20px)}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
@media (min-width:900px) and (pointer:fine) and (prefers-reduced-motion: no-preference){ html{scroll-snap-type:y mandatory} }
@media (pointer:coarse) and (prefers-reduced-motion: no-preference){ html{scroll-snap-type:y proximity} }
.copertina,.capitolo{scroll-snap-align:start}
footer{scroll-snap-align:end}
body{background:var(--bg); color:var(--ink); font:16.5px/1.65 var(--f-body); margin:0}
.impianto{max-width:1320px; margin:0 auto; padding-inline:20px; padding-block:40px 80px;
  display:grid; grid-template-columns:minmax(0,1fr); gap:0 48px}
@media (min-width:1180px){ .impianto{grid-template-columns:230px minmax(0,1fr)} }
main{min-width:0; max-width:1020px}
h1,h2{font-family:var(--f-display); line-height:1.08; text-wrap:balance; margin:0; letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,5.4vw,3.6rem); font-weight:900}
h2{font-size:clamp(1.7rem,3.6vw,2.5rem); font-weight:900; position:relative; padding-left:36px}
h2::before{content:""; position:absolute; left:0; top:.06em; border-style:solid; border-width:.5em 0 .5em .62em;
  border-color:transparent transparent transparent var(--argento)}
.analisi h2::before{border-left-color:var(--c1)}
.oggi h2::before{border-left-color:var(--c2)}
.capitolo{margin-top:140px; padding-bottom:48px}
.capitolo:first-child{margin-top:0}
p{margin:20px 0}
h2 + p{margin-top:10px}
strong{font-weight:600}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
code{font-family:var(--f-data); font-size:.9em; background:var(--accent-soft); padding:1px 5px; border-radius:3px}
ul{padding-left:22px} li{margin:8px 0}

/* Indice */
.indice{font-size:.9rem}
.indice .titolo{font:800 .78rem/1 var(--f-display); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:12px}
.indice ol{list-style:none; margin:0; padding:0}
.indice li{margin:0 0 4px}
.indice a{color:var(--ink); text-decoration:none; display:block; padding:3px 0 3px 10px; border-left:2px solid transparent; font:700 .9rem/1.35 var(--f-display)}
.indice a:hover{color:var(--c1-ink)}
.indice a.attivo{border-left-color:var(--c1); color:var(--c1-ink)}
.indice .oggi-link:hover{color:var(--c2-ink)}
.indice .oggi-link.attivo{border-left-color:var(--c2); color:var(--c2-ink)}
.indice .gruppo-grigio a:hover{color:var(--grigio)}
.indice .gruppo-grigio a.attivo{border-left-color:var(--grigio-linea); color:var(--grigio)}
@media (min-width:1180px){
  .indice{position:sticky; top:calc(var(--barra) + 20px); align-self:start; max-height:calc(100vh - var(--barra) - 40px); overflow:auto; padding-top:8px}
}
@media (max-width:1179px){
  .indice{position:fixed; z-index:19; top:var(--barra); left:0; right:0; max-height:calc(100dvh - var(--barra)); overflow:auto;
    background:var(--surface); border-bottom:1px solid var(--line); box-shadow:0 14px 28px #0003; padding:18px 20px 24px; display:none}
  .indice.aperto{display:block}
  .indice > ol{columns:2; column-gap:28px}
  .indice li{break-inside:avoid}
}
@media (max-width:560px){ .indice > ol{columns:1} }

/* Barra in alto */
.barra{position:fixed; z-index:20; inset:0 0 auto; height:calc(var(--barra) + env(safe-area-inset-top,0px)); padding:env(safe-area-inset-top,0px) 20px 0;
  display:flex; align-items:center; gap:16px; transition:background .25s, box-shadow .25s; --colore-parte:var(--grigio-linea)}
.barra[data-parte="analisi"]{--colore-parte:var(--c1)} .barra[data-parte="oggi"]{--colore-parte:var(--c2)}
.barra.compatta{background:color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 1px 0 var(--line)}
.dove{flex:1; min-width:0; opacity:0; transform:translateY(-6px); transition:opacity .25s, transform .25s; pointer-events:none}
.barra.compatta .dove{opacity:1; transform:none; pointer-events:auto}
.dove .progetto{display:block; width:max-content; max-width:100%; font:800 .7rem/1.3 var(--f-display); letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dove .progetto:hover{color:var(--ink)}
.posizione{font:800 1.02rem/1.3 var(--f-display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; position:relative; padding-left:16px}
.posizione::before{content:""; position:absolute; left:0; top:.28em; border-style:solid; border-width:.32em 0 .32em .42em;
  border-color:transparent transparent transparent var(--colore-parte)}
.azioni{display:flex; gap:8px; flex:none; margin-left:auto}
.bottone-barra{font:600 .8rem/1 var(--f-body); color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:8px 13px; cursor:pointer; white-space:nowrap}
.bottone-barra:hover{border-color:var(--ink-3)}
#apri-indice{display:none}
@media (max-width:1179px){ #apri-indice{display:inline-block} }
.avanzamento{position:absolute; left:0; bottom:0; width:100%; height:3px; background:var(--colore-parte);
  transform-origin:left; transform:scaleX(var(--avanzamento,0)); opacity:0; transition:opacity .25s}
.barra.compatta .avanzamento{opacity:1}
@media (prefers-reduced-motion: reduce){ .barra,.dove,.avanzamento{transition:none} }

/* Copertina a schermo intero: l'illustrazione riempie lo schermo, titolo in alto a tutta larghezza, diciture in basso */
.copertina{position:relative; display:flex; flex-direction:column; justify-content:space-between; height:100svh; min-height:560px; overflow:hidden;
  background:#14161f; color:#efe3c8; --margine:max(20px, calc(50vw - 640px))}
.bauhaus{position:absolute; inset:0; width:100%; height:100%; z-index:0}
.slide-testa{position:relative; z-index:1; padding:calc(var(--barra) + clamp(16px,3vw,48px)) var(--margine) 0;
  opacity:calc(1 - 1.3 * var(--p,0)); transform:translateY(calc(var(--p,0) * 40px))}
.slide-testa h1{letter-spacing:-.02em; font-size:clamp(2.2rem,6.4vw,5.2rem); text-wrap:pretty;
  transform-origin:left bottom; transform:scale(calc(1 - .3 * var(--p,0)))}
.copertina .sottotitolo{font-size:clamp(1rem,1.7vw,1.35rem); margin:14px 0 0; color:#d9ccaf}
.copertina .sottotitolo p{margin:0}
.copertina .sottotitolo strong{color:#efe3c8}
.info{position:relative; z-index:1; display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px 32px; padding:48px var(--margine) 18px;
  background:linear-gradient(transparent, #14161fd9 60%); font-size:.9rem; line-height:1.45}
.info b{font-family:var(--f-display); font-weight:800; font-size:1.05rem}

/* Tabelle e grafici */
.tabella{overflow-x:auto; margin:16px 0; border:1px solid var(--line); border-radius:6px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:.86rem; line-height:1.4}
th,td{padding:8px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-weight:600; color:var(--ink-2); background:var(--bg); font-size:.74rem; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb, var(--accent-soft) 55%, transparent)}
.oggi tbody tr:hover td{background:color-mix(in srgb, var(--c2-soft) 55%, transparent)}
figure{margin:20px 0 8px; background:#111; border-radius:6px; padding:8px; min-width:0; overflow:hidden}  /* i grafici plotly sono scuri: stessa cornice in entrambi i temi */
.conclusione{border-left:4px solid var(--c1); background:var(--accent-soft); padding:6px 18px; border-radius:0 6px 6px 0; margin:20px 0}
footer{margin-top:80px; padding-top:18px; border-top:1px solid var(--line); font-size:.82rem; line-height:1.6; color:var(--ink-3)}
</style>

<header class="barra" id="barra">
  <div class="dove">
    <a class="progetto" href="#copertina">@@TITOLO@@</a>
    <div class="posizione" id="barra-capitolo" aria-live="polite"></div>
  </div>
  <nav class="azioni" aria-label="Navigazione">
    <button class="bottone-barra" id="apri-indice" type="button" aria-controls="indice" aria-expanded="false">Indice</button>
    <button class="bottone-barra" id="tema" type="button" aria-label="Cambia tema chiaro/scuro">Tema</button>
  </nav>
  <div class="avanzamento" aria-hidden="true"></div>
</header>

<section class="copertina" id="copertina">
  <div class="slide-testa">
    <h1>@@TITOLO@@</h1>
    <div class="sottotitolo">@@INTRO@@</div>

<script>
const $ = id => document.getElementById(id);
const barra = $("barra"), copertina = $("copertina");
const riduciMovimento = matchMedia("(prefers-reduced-motion: reduce)").matches;
const capitoli = [...document.querySelectorAll(".capitolo")], voci = [...document.querySelectorAll(".indice a")];
let inCoda = false;
function aggiornaBarra() {
  inCoda = false;
  const y = scrollY, hc = copertina.offsetHeight, hb = barra.offsetHeight, soglia = hb + 40;
  if (!riduciMovimento) copertina.style.setProperty("--p", Math.min(1, y / hc).toFixed(3));
  barra.classList.toggle("compatta", y > hc - hb * 2);
  const max = document.documentElement.scrollHeight - innerHeight;
  let cap = null;
  for (const c of capitoli) if (c.getBoundingClientRect().top <= soglia) cap = c;
  if (y >= max - 2) cap = capitoli.at(-1);  // in fondo l'ultimo capitolo non arriva in cima
  voci.forEach(a => a.classList.toggle("attivo", !!cap && a.getAttribute("href") === "#" + cap.id));
  $("barra-capitolo").textContent = cap ? cap.dataset.titolo : "";
  barra.dataset.parte = cap ? cap.dataset.parte : "";
  barra.style.setProperty("--avanzamento", max > 0 ? Math.min(1, y / max).toFixed(4) : 0);
}
addEventListener("scroll", () => { if (!inCoda) { inCoda = true; requestAnimationFrame(aggiornaBarra); } }, {passive: true});
addEventListener("resize", aggiornaBarra);
aggiornaBarra();

const indice = $("indice"), apriIndice = $("apri-indice");
const mostraIndice = aperto => { indice.classList.toggle("aperto", aperto); apriIndice.setAttribute("aria-expanded", aperto); };
apriIndice.addEventListener("click", () => mostraIndice(!indice.classList.contains("aperto")));
indice.addEventListener("click", e => { if (e.target.closest("a")) mostraIndice(false); });
addEventListener("keydown", e => { if (e.key === "Escape") mostraIndice(false); });

$("tema").addEventListener("click", () => {
  const r = document.documentElement, scuro = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = scuro ? "light" : "dark";
});
</script>
